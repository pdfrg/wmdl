version: 2
project_name: wmdl
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/wmdl
    binary: wmdl
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
checksum:
  name_template: "checksums.txt"
# NOTE: the default changelog format embeds committer emails — never use it.
# This format intentionally omits all author fields (solo project; the
# address in git history must stay private). Verify with:
#   gh release view <tag> --repo pdfrg/wmdl | grep -i tutanota
changelog:
  use: git
  sort: asc
  format: "* {{ .Message }} ({{ .SHA }})"
  abbrev: 7
