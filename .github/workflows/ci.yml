name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Format
        run: go fmt ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build -ldflags="-X main.version=$(git describe --tags --dirty --always 2>/dev/null || echo dev)" ./cmd/wmdl

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
