an=9780063440364&amp;listref=new-books&quot;],&quot;form&quot;:[0,&quot;BB&quot;],&quot;listPrice&quot;:[0,3000],&quot;bookshopPrice&quot;:[0,2796],&quot;listPriceCurrency&quot;:[0,&quot;usd&quot;],&quot;isFreeDigital&quot;:[0,false],&quot;isDrmFree&quot;:[0,false],&quot;isBlpEligibleAudiobook&quot;:[0,false],&quot;contributors&quot;:[1,[[0,{&quot;notes&quot;:[1,[[0,&quot;&lt;p&gt;&lt;b&gt;Michelle Tea&lt;/b&gt; is the author of over a dozen books, including the cult-classic &lt;i&gt;Valencia&lt;/i&gt;, the essay collection &lt;i&gt;Against Memoir&lt;/i&gt;, and the memoirS &lt;i&gt;Black Wave &lt;/i&gt;and&lt;i&gt; Knocking Myself Up. &lt;/i&gt;She is the recipient of awards from the Guggenheim, Lambda Literary, and Rona Jaffe Foundations, PEN/America, and other institutions. &lt;/p&gt;&lt;p&gt;Tea's cultural interventions include brainstorming the international phenomenon Drag Queen Story Hour, co-creating the Sister Spit queer literary performance tours, and occupying the role of Founding Director at RADAR Productions, a Bay Area literary organization, for over a decade. She also helmed the imprints Sister Spit Books at City Lights Publishers, and Amethyst Editions at The Feminist Press. She produces and hosts the &lt;i&gt;Your Magic&lt;/i&gt; podcast, where she reads tarot cards for Roxane Gay, Alexander Chee, Phoebe Bridgers, and other artists, as well as the live tarot show &lt;i&gt;Ask the Tarot &lt;/i&gt;on Spotify Greenroom.&lt;/p&gt;&quot;]]],&quot;roles&quot;:[1,[[0,&quot;A01&quot;]]],&quot;full_name&quot;:[0,&quot;Michelle Tea&quot;],&quot;is_ai_contributor&quot;:[0,false]}]]],&quot;status&quot;:[0,&quot;in stock&quot;],&quot;quantity&quot;:[0,274],&quot;estimatedAvailabilityDays&quot;:[0,-1],&quot;publishDate&quot;:[0,&quot;2026-11-17T00:00:00.000Z&quot;],&quot;numberOfPages&quot;:[0,304],&quot;duration&quot;:[0,null],&quot;languageCode&quot;:[0,&quot;eng&quot;],&quot;annotation&quot;:[0,&quot;&lt;p&gt;“&lt;em&gt;Free Love&lt;/em&gt; is many books at once – a survey of the liberationist history of polyamory, a memoir of Tea’s own experiments in the field, and a guide to some of the most intrepid, lively figures currently out there exploring the field. As always with Tea, however, the book vaults above these laudatory achievements, and – by dint of Tea’s unrivaled vulnerability, wit, and curiosity – invites us to revisit our own lives, reorder our own programming, and consider how we, too, might live in pursuit of better love and a better world.” &lt;strong&gt;—Maggie Nelson, author of &lt;em&gt;The Argonauts&lt;/em&gt; and &lt;em&gt;On Freedom&lt;/em&gt;&lt;/strong&gt;&lt;/p&gt;&quot;]}],[0,{&quot;sku&quot;:[0,&quot;9781250430021&quot;],&quot;title&quot;:[0,&quot;Universe of Grace&quot;],&quot;subtitle&quot;:[0,&quot;A Novel&quot;],&quot;coverUrl&quot;:[0,&quot;https://images-us.bookshop.org/ingram/9781250430021.jpg?v=54c4817a669c49005d242d41b1171157&quot;],&quot;href&quot;:[0,&quot;/p/books/universe-of-grace-a-novel-rachel-calnek-sugin/fb8631ca051bd8b6?ean=9781250430021&amp;listref=new-books&quot;],&quot;form&quot;:[0,&quot;BB&quot;],&quot;listPrice&quot;:[0,2899],&quot;bookshopPrice&quot;:[0,2702],&quot;listPriceCurrency&quot;:[0,&quot;usd&quot;],&quot;isFreeDigital&quot;:[0,false],&quot;isDrmFree&quot;:[0,false],&quot;isBlpEligibleAudiobook&quot;:[0,false],&quot;contributors&quot;:[1,[[0,{&quot;notes&quot;:[1,[[0,&quot;Born and raised in New York City, &lt;b&gt;Rachel Calnek-Sugin&lt;/b&gt; is a writer, social worker, and educator committed to our individual and collective liberation through art-making, community building, and personal transformation. She loves trees, dancing down the streets of Brooklyn, and cooking extravagant meals for her loved ones. She works as a therapist in New York City’s public schools and writes fiction, nonfiction, plays, and the occasional subway-poem. &lt;i&gt;Universe of Grace&lt;/i&gt; is her first novel.&lt;u&gt;&lt;/u&gt;&quot;]]],&quot;roles&quot;:[1,[[0,&quot;A01&quot;]]],&q
